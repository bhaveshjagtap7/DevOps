name: DevOps Multi-Module CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-test:
    name: Python Docker & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./python-docker-exercise
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: ./python-docker-exercise
        run: |
          pytest tests/ -v

  java-test:
    name: Java Maven Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build and run JUnit tests
        working-directory: ./java-mvn-cicd-pipeline
        run: |
          mvn clean test -B

  terraform-validate:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        working-directory: ./terraform-ec2-controller
        run: |
          terraform fmt -check

  k8s-validate:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate YAML files syntax
        run: |
          python3 -c "
import glob, yaml
for file in glob.glob('k8s-minikube-lab/*.yaml'):
    with open(file, 'r') as f:
        list(yaml.safe_load_all(f))
    print(f'[OK] Validated {file}')
          "